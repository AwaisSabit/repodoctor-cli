[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoctor"
version = "0.1.0"
description = "A command-line repository health checker for Python projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Awais Sabit", email = "awaissabit@gmail.com"}]
keywords = ["cli", "repository", "health-check", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["ruff>=0.6"]

[project.scripts]
repodoctor = "repodoctor.cli:main"

[project.urls]
Homepage = "https://github.com/AwaisSabit/repodoctor-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Ruff is the linter and formatter. Keep the line length at 88 so it
# matches the formatting the codebase already uses.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W: style, F: unused imports and names, I: import order.
select = ["E", "F", "W", "I"]
